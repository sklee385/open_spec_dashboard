name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: '전체 검증(장시간·총 소요 미확인): 이유와 소요 안내 후 사용자가 명시 승인한 경우만 선택'
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows Git checkout child 경계 검증은 짧은 임시 경로를 사용한다.
      TEMP: 'C:\Windows\Temp'
      TMP: 'C:\Windows\Temp'
      DESKTOP_RELEASE: ${{ github.event_name == 'push' && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          architecture: x64
          cache: npm
      - name: Validate personal release prerequisites
        if: github.event_name == 'push'
        run: node -e "require('./desktop/release.cjs').validateRelease({platform:process.platform,arch:process.arch,version:require('./package.json').version,tag:process.env.GITHUB_REF_NAME,env:process.env})"
      - name: Prepare project Node runtime
        shell: pwsh
        run: ./scripts/setup-runtime.ps1 -NodeDirectory (Split-Path (Get-Command node).Source)
      - run: ./scripts/npm.ps1 ci
      - name: Install Electron binary
        run: ./scripts/node.ps1 node_modules/electron/install.js
      - name: Prepare verification browser and process guard
        run: ./scripts/setup-browser.ps1
      - name: Verify changed release publisher
        if: github.event_name != 'workflow_dispatch' || !inputs.full_suite
        run: ./scripts/node.ps1 --test desktop/test/publish.test.cjs
      - name: Verify background navigation and document direct impact paths
        if: github.event_name != 'workflow_dispatch' || !inputs.full_suite
        timeout-minutes: 30
        run: ./scripts/node.ps1 scripts/test-release.cjs --background-documents
      - name: Full desktop tests (explicit user request only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: ./scripts/npm.ps1 run desktop:test
      - name: Full workspace tests (explicit user request only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        timeout-minutes: 300
        run: ./scripts/npm.ps1 test
      - run: ./scripts/npm.ps1 run build
      - name: Stage application
        shell: pwsh
        run: |
          if ($env:DESKTOP_RELEASE -eq '1') {
            ./scripts/node.ps1 scripts/desktop-stage.cjs --release
          } else {
            ./scripts/node.ps1 scripts/desktop-stage.cjs --personal-update
          }
      - run: ./scripts/npm.ps1 run desktop:dist
      - name: Verify packaged daily dashboard and normal shutdown
        run: ./scripts/node.ps1 scripts/desktop-smoke.cjs --security --personal-update --daily-dashboard
      - name: Prior renderer recovery and session preservation (explicit full request only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: ./scripts/node.ps1 scripts/desktop-smoke.cjs --security --personal-update --renderer-recovery --health
      - name: Verify isolated force exit and safe restart with profile draft recovery
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: ./scripts/node.ps1 scripts/desktop-force-smoke.cjs
      - name: Build portable ZIP and metadata
        run: ./scripts/node.ps1 scripts/desktop-portable-build.cjs
      - name: Verify actual Electron ASAR portable update and candidate restart
        run: ./scripts/node.ps1 scripts/desktop-portable-update-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win32-x64
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .tools/desktop-dist/*.exe
            .tools/desktop-dist/*.blockmap
            .tools/desktop-dist/*-portable.zip
            .tools/desktop-dist/portable.json
            .tools/desktop-dist/latest.yml
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: desktop-win32-x64
          path: release-files
      - name: Validate complete release
        run: node desktop/artifacts.cjs release-files "${GITHUB_REF_NAME#v}"
      - name: Publish verified draft without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/publish.cjs release-files
